name: urban_mobility
version: 1.0.0
config-version: 2
profile: urban_mobility
require-dbt-version: [">=1.8.0", "<2.0.0"]

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "logs"

models:
  urban_mobility:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  urban_mobility:
    +schema: staging
    +quote_columns: false

vars:
  # Local timezone of the Citi Bike service area. Source timestamps are naive
  # local (America/New_York) wall times; all DST classification uses this zone.
  local_tz: America/New_York

  # The verified source-coverage windows (and any known outages) are now
  # data-driven seeds, not vars: see seeds/coverage_windows.csv and
  # seeds/coverage_gaps.csv. Add a month by adding a seed row.
