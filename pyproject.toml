[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citi-bike-ingest"
version = "0.1.0"
description = "Urban Mobility Analytics & Demand Forecasting - Citi Bike ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "requests>=2.31.0",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "scikit-learn>=1.8.0",
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-requests>=2.31.0.20240406",
    "types-python-dateutil>=2.9.0.20240316",
]

[project.scripts]
citi-ingest = "citi_bike_ingest.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/citi_bike_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
